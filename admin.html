<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel · Área restrita</title>
  <meta name="theme-color" content="#0b0b0b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='16' height='32' fill='%23fff'/><rect x='16' width='16' height='32' fill='%23000'/><rect x='.5' y='.5' width='31' height='31' fill='none' stroke='%23000'/></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="adm">

<!-- Tela de login -->
<section class="login" id="login">
  <div class="login__card">
    <p class="eyebrow">Área restrita</p>
    <h1 class="login__title">Painel</h1>
    <p class="text" id="login-msg">Entre com a conta Google cadastrada pelo administrador.</p>
    <button class="btn btn--light" id="btn-google" type="button">Entrar com Google</button>
    <p class="login__note">Por segurança a sessão expira em 15 minutos e é preciso entrar de novo.</p>
    <a class="login__back" href="./">← Voltar ao site</a>
  </div>
</section>

<!-- Painel -->
<div class="panel" id="panel" hidden>
  <header class="bar">
    <a href="./" class="brand" target="_blank" rel="noopener"><span>Painel</span></a>
    <div class="bar__right">
      <span class="bar__who" id="who"></span>
      <span class="bar__timer" id="timer" title="Tempo restante da sessão">15:00</span>
      <button class="btn btn--sm btn--outline" id="btn-sair" type="button">Sair</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Seções do painel"></nav>
  <main class="wrap adm__main">
    <div class="adm__head">
      <h2 class="adm__title" id="tab-title"></h2>
      <button class="btn btn--light btn--sm" id="btn-novo" type="button">+ Novo</button>
    </div>
    <div class="rows" id="rows"></div>
  </main>
</div>

<!-- Formulário de edição -->
<dialog class="dlg" id="dlg">
  <form id="form" method="dialog" novalidate>
    <header class="dlg__head"><h3 id="form-title"></h3><button class="dlg__x" type="button" id="btn-fechar" aria-label="Fechar">×</button></header>
    <div class="dlg__body" id="fields"></div>
    <p class="dlg__err" id="form-err" role="alert"></p>
    <footer class="dlg__foot">
      <button class="btn btn--danger btn--sm" type="button" id="btn-excluir">Excluir</button>
      <button class="btn btn--light btn--sm" type="submit" id="btn-salvar">Salvar</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
