# Faz uma leitura leve no Supabase a cada 3 dias para o plano grátis
# não pausar o projeto por inatividade.
# Configure em Settings > Secrets and variables > Actions > Variables:
#   SUPABASE_URL  e  SUPABASE_ANON_KEY  (a chave anon é pública)
name: Supabase keep-alive
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: Ping
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$URL/rest/v1/config?select=chave&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
